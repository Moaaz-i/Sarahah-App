      responses:
        '200': { description: Sessions revoked }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/reports:
    get:
      tags: [Admin]
      summary: List reports with status filter (admin only)
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: status, in: query, schema: { type: string, enum: [pending, reviewed, dismissed] } }
      responses:
        '200': { description: Reports list }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/reports/{id}:
    patch:
      tags: [Admin]
      summary: Update report status (admin only)
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, pattern: '^[0-9a-fA-F]{24}$' } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [pending, reviewed, dismissed] }
      responses:
        '200': { description: Report updated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/audit-logs:
    get:
      tags: [Admin]
      summary: Audit trail (admin only)
      parameters:
        - { name: page, in: query, schema: { type: integer, minimum: 1, default: 1 } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 20 } }
        - { name: action, in: query, schema: { type: string, maxLength: 100 } }
      responses:
        '200': { description: Audit logs }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/system:
    get:
      tags: [Admin]
      summary: Real-time system health and Redis metrics (admin only)
      description: |
        Returns live operational diagnostics including:
        - Redis connection status, round-trip latency (ping), and total keys
        - MongoDB connection status and readyState
        - Node.js heap memory and RSS usage
        - Server uptime and host platform load
      responses:
        '200':
          description: System health diagnostics
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SuccessResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/admin/system/flush-cache:
    post:
      tags: [Admin]
      summary: Purge application Redis cache (admin only)
      description: |
        Safely clears non-persistent cache keys while logging an audit trail event.
      responses:
        '200':
          description: Cache flushed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/confirm-email/send:
    post:
      tags: [Email Confirmation]
      summary: Send email confirmation code (OTP)
      description: |
        Sends a 6-digit numeric OTP to the caller's registered email address.
        Rate limited to 10 requests per 15 minutes.
      security:
        - bearerAuth: []
      responses:
        '202': { description: Verification code sent }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '429': { $ref: '#/components/responses/TooManyRequests' }

  /api/v1/confirm-email/verify:
    post:
      tags: [Email Confirmation]
      summary: Verify email with OTP code
      description: |
        Validates the 6-digit OTP code and marks `isVerified: true` on the caller's account.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^\\d{6}$', example: '123456' }
      responses:
        '200': { description: Email confirmed successfully }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthenticated' }

